name: R02 source preparation
on:
  push:
    branches: [codex/r02-preparation-20260926-d248]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .r02-preparation
      - name: Read pinned preparation tool
        run: curl --fail --location https://raw.githubusercontent.com/night-outlook/hybridclr/315da7570281d98391692f2bbe5a608dfb94296c/.r02-preparation/prepare.py -o .r02-preparation/prepare.py
      - name: Reconstruct source blobs without publishing a feature ref
        env:
          PREPARE_TOKEN: ${{ github.token }}
        run: python3 .r02-preparation/prepare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r02-prepared-hybridclr_unity
          path: |
            prepared/source-map.json
            prepared/work/
            prepared/primary/
          retention-days: 7
