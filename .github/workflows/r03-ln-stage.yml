name: R03 LN checked object staging
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths: ['.github/workflows/r03-ln-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef6c70f30248c4b7c41e9e85d81e08f5709dc4ba
          persist-credentials: false
      - name: Validate exact preimages and stage content-addressed blobs only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          packed=''
          raw=zlib.decompress(base64.b64decode(packed.replace('VOXTZZ3','VOXTZ3')))
          assert hashlib.sha256(raw).hexdigest()=='86997acdcd1d65dd4fee68e88348b75594044108b47278aa1d2b75aed7f17a86'
          rows=[];out=pathlib.Path(os.environ['RUNNER_TEMP'])/'objects';out.mkdir()
          for item in json.loads(raw)['files']:
              path=item['path'];assert not path.startswith('/') and '..' not in pathlib.Path(path).parts
              data=subprocess.check_output(['git','show',item['before']]) if item['before'] else b''
              assert (hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() if data else None)==item['before']
              lines=data.decode().splitlines(keepends=True)
              for e in reversed(item['edits']):lines[e['start']:e['end']]=[e['text']]
              data=''.join(lines).encode();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
              response=json.load(urllib.request.urlopen(request));assert response['sha']==item['sha']
              rows.append({'path':path,'mode':item['mode'],'type':'blob','sha':item['sha']})
              target=out/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          (out/'objects.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-ln-package-objects
          path: ${{ runner.temp }}/objects
          retention-days: 14
          if-no-files-found: error
